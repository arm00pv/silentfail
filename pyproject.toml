[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silentfail"
version = "0.1.0"
description = "Find the four defect classes that make a system lie while reporting success."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["lint", "observability", "reliability", "testing", "silent-failure"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/arm00pv/silentfail"

[project.scripts]
silentfail = "silentfail:main"

[tool.setuptools]
py-modules = ["silentfail"]
